spring.application.name=monthly-expense-tracker
server.port=8080

# File-based H2 database. Run Maven from the backend directory.
spring.datasource.url=jdbc:h2:file:./data/expensetracker;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Local development database console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.error.include-message=never
